name: Bug report
description: Report a reproducible defect in VORaytracer
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve VORaytracer. Please remove private or non-redistributable assets from logs and attachments.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Render backend
      options:
        - Vulkan
        - OptiX
        - Both
        - Not applicable
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: Commit hash or release tag
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: GPU, driver, Windows version, Visual Studio/toolset, CUDA, OptiX, Vulkan SDK, and build configuration.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Add validation output, stderr excerpts, screenshots, or a minimal redistributable test asset.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I can legally share all attached assets.
          required: true
